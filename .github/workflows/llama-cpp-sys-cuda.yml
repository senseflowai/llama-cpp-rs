name: llama-cpp-sys CUDA build

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - llama-cpp-sys-2/**
      - .github/workflows/llama-cpp-sys-cuda.yml
  pull_request:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - llama-cpp-sys-2/**
      - .github/workflows/llama-cpp-sys-cuda.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  cuda:
    name: llama-cpp-sys-2 cuda
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive

      - name: Build CUDA link smoke test
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            nvidia/cuda:12.6.2-devel-ubuntu24.04 \
            bash -lc '
              set -eux
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang \
                cmake \
                curl \
                git \
                libclang-dev \
                libssl-dev \
                llvm-dev \
                pkg-config \
                python3
              rm -rf /var/lib/apt/lists/*

              export CARGO_HOME=/tmp/cargo
              export RUSTUP_HOME=/tmp/rustup
              export PATH="${CARGO_HOME}/bin:${PATH}"
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.88.0

              export GGML_CUDA=ON
              export CARGO_TARGET_DIR=/tmp/llama-cpp-rs-target
              export CARGO_NET_GIT_FETCH_WITH_CLI=true
              export CARGO_INCREMENTAL=0
              export CARGO_PROFILE_RELEASE_DEBUG=0
              export CMAKE_POSITION_INDEPENDENT_CODE=ON
              export CMAKE_CUDA_ARCHITECTURES="86;89"
              export CMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
              export CMAKE_CUDA_FLAGS="-Xcompiler=-fPIC"

              cargo build --release --locked --bin simple --features cuda
            '
